likelihood:
  gp_emulator:
    external: !!python/name:__main__.GPEmulatorLikelihood ''
    input_params:
    - theta_ej_0
    - nu_theta_ej_M
    emulator_path: /work/hdd/bdne/aacharya2/GODMAX/notebooks/CMASSfirstbin/new/n1024/sbi/gp_emulator_all_3pt.pkl
    x_obs_path: /work/hdd/bdne/aacharya2/GODMAX/notebooks/CMASSfirstbin/new/n1024/sbi/x_obs.npy
    feature_idx:
    - 0
    - 6
    - 12
    - 18
    - 24
    - 30
    - 1
    - 7
    - 13
    - 19
    - 25
    - 31
    - 2
    - 8
    - 14
    - 20
    - 26
    - 32
params:
  theta_ej_0:
    prior:
      min: 1.0
      max: 6.0
    ref: 3.5
    proposal: 0.5
    latex: \theta_{ej,0}
  nu_theta_ej_M:
    prior:
      min: -0.3
      max: 0.0
    ref: -0.15
    proposal: 0.03
    latex: \nu_{\theta_{ej}}^{M}
sampler:
  mcmc:
    Rminus1_stop: 0.02
    Rminus1_cl_stop: 0.2
    learn_proposal: true
    learn_proposal_Rminus1_max: 0.5
    burn_in: 200
    max_samples: 5000
    max_tries: 10000
output: mcmc
