# Likelihood scale cuts copied verbatim from the 64-param fcen_relaxedmin_lmax2000
# HMC config (params_..._64param_fcen_relaxedmin_lmax2000.yaml): low-ell cuts removed
# (no family_ell_min); galaxy auto / galaxy-shear / galaxy-y / kSZ capped at ell_max=2000,
# galaxy-kappa at 1000, everything else at the default 3000. Used by the comparison plot
# to gray out bandpowers not used in the likelihood (matches the MAP comparison figure).
likelihood_cuts:
  band_selection: center
  default_ell_max: 3000
  family_ell_max:
    desi_g_auto: 2000
    desi_g_des_shear_E: 2000
    desi_g_act_y: 2000
    desi_pi_act_T: 2000
    desi_g_act_kappa: 1000
