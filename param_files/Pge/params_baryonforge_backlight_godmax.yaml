# GODMAX side of the BaryonForge--GODMAX Backlight parity experiment.
#
# This is an override for param_files/params_default.yaml.  It deliberately uses
# the simple-stellar and no-backreaction branches because those are the branches
# that stock BaryonForge Schneider19 can represent with the same analytic
# parameters.  The orchestration file pins the catalog cosmology again from HDF5.

sim_params:
  cosmo:
    flat: true
    H0: 67.11
    Om0: 0.3175
    Ob0: 0.049
    sigma8: 0.834
    ns: 0.9624
    w0: -1.0

  init_power: true
  nfw_trunc: true
  epsilon_rt: 4.0

  theta_ej_0: 2.0
  log10_Mstar0_theta_ej: 16.0
  nu_theta_ej_M: -0.33
  nu_theta_ej_z: -1.22
  nu_theta_ej_c: 0.0

  theta_co_0: 0.05
  log10_Mstar0_theta_co: 16.0
  nu_theta_co_M: 0.0
  nu_theta_co_z: 0.0
  nu_theta_co_c: 0.0

  mu_beta: 0.0762
  log10_Mstar0: 14.0
  log10_Mc0: 13.75
  nu_M: 0.0
  nu_z: 0.0
  gamma_rhogas: 2.0
  delta_rhogas: 7.0

  # Ignored when analysis.backreaction=false and retained only for a later,
  # separately labelled native-backreaction experiment.  The baseline maps
  # GODMAX backreaction=false to BaryonForge a=0; it does not use a_zeta.
  a_zeta: 0.3
  n_zeta: 2.0

  alpha_nt: 0.05
  beta_nt: 0.0
  n_nt: 0.3

  # Exactly mappable simple stellar fractions.  Do not set model_galaxies=true
  # for the parity baseline.
  A_starcga: 0.09
  log10_M1_starcga: 11.4
  eta_star: 0.3
  eta_cga: 0.6

halo_params:
  rmin: 0.003
  rmax: 12.0
  nr: 64
  zmin: 0.60
  zmax: 1.02
  nz: 48
  lg10_Mmin: 12.75
  lg10_Mmax: 16.0
  nM: 48
  mdef_Delta: 200
  conc_model: Duffy08
  hmf_model: T10

analysis:
  backreaction: false
  model_galaxies: false
  model_tSZ: true
  calc_nfw_only: true
  num_points_trapz_int: 64
  symbolic_pk: false
  symbolic_hmf: false
  verbose_time: false
  is_cmb_lensing: true
  # The default file carries this value as a one-element YAML-1.1 string
  # list (``5e-4``), which JAX cannot convert during base-class setup.  A
  # scalar is broadcast over the redshift grid and is irrelevant here because
  # the parity baseline disables the galaxy model.
  nbar_gal_comoving_val: 0.0005

other_params:
  A_IA: 0.0
  eta_IA: 0.0
  alpha_ky: 1.0
