description: >
  Stage-31 NumPyro HMC configuration for fitting the corrected 2026-06-17
  xDESI midres2048 multi-probe measurement with fixed Abacus/Backlight-like
  cosmology, simple 1-halo + 2-halo tracer-side transitions while keeping the
  matter transition on the response model. This 60-parameter run fits the
  refreshed 13-band lmax3000 data vector with conservative family scale cuts,
  including DESI galaxy autos restricted to 200 <= ell_eff <= 2500. It runs
  100 warmup samples plus 2000 production samples per chain and leaves the
  NUTS target acceptance at the NumPyro default.

comparison_config: param_files/xDESI/params_multiprobe_midres2048_true_nz_theory_abacus_cosmo_simple1h2h_lmax3000_13log_apo1deg_C2.yaml
prior_file: param_files/xDESI/priors_multiprobe_midres2048_hmc_stage31_60param_desy3.yaml

stage: stage31_midres2048_abacus_cosmo_simple1h2h_lmax3000_gk1000_depth6_defaultacc_warm100_60param
output_dir: notebooks/xDESI/survey_measure/outputs/godmax_multiprobe_midres2048_true_nz_hmc_stage31_abacus_cosmo_simple1h2h_lmax3000_gk1000_depth6_defaultacc_warm100_60param
minimum_halo_log10_m200c_hmsun: 11.147538
force_simple_1h2h: true
sample_des_shear_m_bias_in_model: true

likelihood_cuts:
  band_selection: center
  default_ell_max: 3000
  family_ell_min:
    act_y_des_shear_E: 200
    desi_g_auto: 200
    desi_g_act_y: 200
    desi_g_act_kappa: 200
    desi_pi_act_T: 1000
  family_ell_max:
    desi_g_auto: 2500
    desi_g_act_kappa: 1000

covariance:
  type: whitened_correlation_eigencut
  eigenvalue_threshold: 1.0e-8

sampler:
  seed: 1062
  num_warmup: 100
  num_samples: 2000
  num_chains: 4
  chain_method: vectorized
  dense_mass: true
  max_tree_depth: 6
  forward_mode_differentiation: false
  jit_model_args: true
  progress_bar: false

smoke_sampler:
  seed: 1063
  num_warmup: 25
  num_samples: 50
  num_chains: 1
  chain_method: sequential
  dense_mass: true
  max_tree_depth: 5
  target_accept_prob: 0.9
  forward_mode_differentiation: false
  jit_model_args: true
  progress_bar: true
