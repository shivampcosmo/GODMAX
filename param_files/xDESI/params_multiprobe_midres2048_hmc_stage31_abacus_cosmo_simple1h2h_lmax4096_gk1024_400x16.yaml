description: >
  Stage-31 NumPyro HMC configuration for fitting the xDESI midres2048
  multi-probe measurement with fixed Abacus/Backlight-like cosmology,
  simple 1-halo + 2-halo tracer-side transitions while keeping the
  matter transition on the response model, all probes kept to the
  lmax4096 data vector, and DESI galaxy x ACT kappa restricted to
  effective ell <= 1024. This is a 1600-sample-per-chain run with
  4 vectorized chains per GPU.

comparison_config: param_files/xDESI/params_multiprobe_midres2048_true_nz_theory_abacus_cosmo_simple1h2h.yaml
prior_file: param_files/xDESI/priors_multiprobe_fast1024_hmc_stage31.yaml

stage: stage31_midres2048_abacus_cosmo_simple1h2h_lmax4096_gk1024
output_dir: notebooks/xDESI/survey_measure/outputs/godmax_multiprobe_midres2048_true_nz_hmc_stage31_abacus_cosmo_simple1h2h_lmax4096_gk1024
minimum_halo_log10_m200c_hmsun: 11.147538
force_simple_1h2h: true

likelihood_cuts:
  band_selection: center
  default_ell_max: 4096
  family_ell_max:
    desi_g_act_kappa: 1024

covariance:
  type: whitened_correlation_eigencut
  eigenvalue_threshold: 1.0e-8

sampler:
  seed: 42
  num_warmup: 400
  num_samples: 1600
  num_chains: 4
  chain_method: vectorized
  dense_mass: true
  max_tree_depth: 4
  target_accept_prob: 0.85
  forward_mode_differentiation: false
  jit_model_args: true
  progress_bar: false

smoke_sampler:
  seed: 43
  num_warmup: 40
  num_samples: 160
  num_chains: 1
  chain_method: sequential
  dense_mass: true
  max_tree_depth: 4
  target_accept_prob: 0.8
  forward_mode_differentiation: false
  jit_model_args: true
  progress_bar: true
